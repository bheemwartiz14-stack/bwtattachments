<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>You're offline — BWT Attachments</title>
    <style>
        * { box-sizing: border-box; margin: 0; }
        body {
            font-family: 'Figtree', ui-sans-serif, system-ui, sans-serif;
            background: #f8fafc;
            color: #0f172a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .card {
            max-width: 420px;
            width: 100%;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 40px 32px;
            text-align: center;
            box-shadow: 0 1px 2px rgba(2, 6, 23, 0.06);
        }
        .dot {
            width: 14px; height: 14px;
            border-radius: 9999px;
            background: #ef4444;
            margin: 0 auto 20px;
            display: block;
        }
        h1 { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
        p { font-size: 15px; line-height: 1.6; color: #475569; }
        button {
            margin-top: 24px;
            border: none;
            background: #0b5cab;
            color: #fff;
            font-weight: 600;
            font-size: 14px;
            padding: 12px 24px;
            border-radius: 10px;
            cursor: pointer;
        }
        button:hover { background: #0a52a0; }
        .retry { margin-top: 14px; font-size: 13px; color: #94a3b8; }
    </style>
</head>
<body>
    <div class="card">
        <span class="dot" aria-hidden="true"></span>
        <h1>You're offline</h1>
        <p>You appear to have lost your internet connection. Check your network and try again.</p>
        <button onclick="location.reload()">Retry</button>
        <div class="retry">BWT Attachments</div>
    </div>
</body>
</html>
