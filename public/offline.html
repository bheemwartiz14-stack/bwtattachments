<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Offline — BWT Attachments</title>
    <style>
        body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:#f3f4f6; color:#111827; display:flex; align-items:center; justify-content:center; height:100vh; }
        .card { text-align:center; max-width:24rem; padding:2rem; }
        .card h1 { font-size:1.4rem; margin:0 0 .5rem; }
        .card p { color:#4b5563; line-height:1.5; margin:.5rem 0 1.25rem; }
        .btn { display:inline-block; background:#1c6bb0; color:#fff; border:0; border-radius:.5rem; padding:.6rem 1.2rem; font-weight:600; text-decoration:none; }
        .dot { width:2.5rem; height:2.5rem; border-radius:50%; background:#e5e7eb; margin:0 auto 1rem; display:flex; align-items:center; justify-content:center; }
    </style>
</head>
<body>
    <div class="card">
        <div class="dot">📡</div>
        <h1>You're offline</h1>
        <p>It looks like you lost your connection. Your saved work is kept on this device and will sync automatically once you're back online.</p>
        <a class="btn" href="/">Try again</a>
    </div>
</body>
</html>
